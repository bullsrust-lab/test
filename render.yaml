services:
  - type: web
    name: jobtrail
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      # the test-only mongodb-memory-server would otherwise download a MongoDB binary on every deploy
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: JWT_LIFETIME
        value: 1d
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
