name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # coverage report in the log, and the 65% threshold fails the build
      - run: npm test -- --coverage
      - run: npm run test:client
      - run: npm run build
